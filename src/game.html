<title>Frasco de Luz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b1026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Una sola escena nocturna a pantalla completa: el canvas es el juego, la interfaz flota encima. */
:root {
  color-scheme: dark;
  --night: #0b1026;
  --night-2: #18204a;
  --glow: #ffe27a;
  --glow-hot: #ffb547;
  --leaf: #08261f;
  --ink: #eef0ff;
  --ink-soft: #a9b0d9;
  --danger: #7fc8ff;
  --display: "Sniglet", "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; width: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.score { font-family: var(--display); font-weight: 800; font-size: 2.6rem; line-height: 1; color: var(--glow); text-shadow: 0 0 18px rgba(255,210,90,.55); }
.label { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); font-weight: 800; }
.right { text-align: right; display: grid; gap: 6px; justify-items: end; }
.lives { display: flex; gap: 6px; }
.life { width: 14px; height: 14px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 10px var(--glow); transition: opacity .3s, transform .3s; }
.life.off { opacity: .18; box-shadow: none; transform: scale(.7); }
.combo { font-family: var(--display); color: var(--glow-hot); font-size: 1rem; min-height: 1.2em; }

.btn-pause {
  position: absolute; bottom: 0; right: 0;
  margin-right: max(12px, env(safe-area-inset-right, 0px)); margin-bottom: 12px;
  width: 44px; height: 44px; border-radius: 50%;
  border: 1.5px solid rgba(238,240,255,.25); background: rgba(11,16,38,.5); color: var(--ink);
  font: 800 1rem var(--body); cursor: pointer;
}
.btn-pause:focus-visible, .btn:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }

.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at 50% 40%, rgba(24,32,74,.55), rgba(11,16,38,.88));
}
.panel { max-width: 22rem; width: 100%; text-align: center; display: grid; gap: 14px; justify-items: center; }
.panel h1, .panel h2 { margin: 0; font-family: var(--display); font-weight: 800; text-wrap: balance; color: var(--glow); text-shadow: 0 0 24px rgba(255,210,90,.5); }
.panel h1 { font-size: clamp(2.6rem, 13vw, 3.6rem); line-height: .95; }
.panel h2 { font-size: 2.2rem; }
.panel p { margin: 0; color: var(--ink-soft); line-height: 1.5; font-size: 1rem; }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; text-align: left; width: 100%; }
.rules li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; color: var(--ink); font-weight: 700; }
.dot { width: 14px; height: 14px; border-radius: 50%; justify-self: center; }
.dot.f { background: var(--glow); box-shadow: 0 0 10px var(--glow); }
.dot.g { background: var(--glow-hot); box-shadow: 0 0 14px var(--glow-hot); width: 18px; height: 18px; }
.dot.r { background: var(--danger); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); width: 12px; height: 12px; }
.big { font-family: var(--display); font-size: 4rem; line-height: 1; color: var(--glow); font-variant-numeric: tabular-nums; }
.btn {
  margin-top: 6px; border: 0; border-radius: 999px; cursor: pointer;
  padding: 14px 40px; font: 800 1.2rem var(--display);
  color: var(--night); background: var(--glow);
  box-shadow: 0 0 0 4px rgba(255,226,122,.18), 0 0 30px rgba(255,210,90,.45);
}
.btn:active { transform: scale(.97); }
.best { font-size: .9rem; color: var(--ink-soft); }
.best b { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .life { transition: none; } }
</style>

<div id="app">
  <canvas id="c" aria-label="Juego Frasco de Luz"></canvas>

  <div class="hud" aria-live="polite">
    <div>
      <div class="label">Luciérnagas</div>
      <div class="score" id="score">0</div>
      <div class="combo" id="combo"></div>
    </div>
    <div class="right">
      <div class="lives" id="lives" aria-label="Vidas"></div>
      <div class="label">Noche <span id="lvl">1</span></div>
    </div>
  </div>

  <button class="btn-pause" id="pause" aria-label="Pausar" hidden>II</button>

  <div class="overlay" id="start">
    <div class="panel">
      <h1>Frasco<br>de Luz</h1>
      <p>Arrastra el frasco con el dedo y atrapa luciérnagas antes de que amanezca.</p>
      <ul class="rules">
        <li><span class="dot f"></span>Luciérnaga: 1 punto</li>
        <li><span class="dot g"></span>Luciérnaga dorada: 5 puntos</li>
        <li><span class="dot r"></span>Gota de lluvia: pierdes una luz</li>
      </ul>
      <button class="btn" id="play">Jugar</button>
      <div class="best">Récord: <b id="best0">0</b></div>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="panel">
      <h2>En pausa</h2>
      <button class="btn" id="resume">Seguir</button>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel">
      <h2 id="overTitle">Se apagó la noche</h2>
      <div class="label">Luciérnagas atrapadas</div>
      <div class="big" id="final">0</div>
      <div class="best">Récord: <b id="best1">0</b></div>
      <button class="btn" id="again">Otra vez</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const store = {
    get() { try { return +localStorage.getItem('frasco-best') || 0; } catch { return 0; } },
    set(v) { try { localStorage.setItem('frasco-best', String(v)); } catch {} }
  };

  let W = 0, H = 0, DPR = 1, bg = null;
  const MAX_LIVES = 3;
  let state = 'menu';
  let flies = [], drops = [], sparks = [];
  let score = 0, lives = MAX_LIVES, combo = 0, t = 0, spawnF = 0, spawnD = 0, hurt = 0, best = store.get();
  const jar = { x: 0, tx: 0, w: 64, h: 78 };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    jar.w = Math.max(56, Math.min(84, W * 0.17));
    jar.h = jar.w * 1.2;
    if (!jar.x) jar.x = jar.tx = W / 2;
    jar.x = Math.min(Math.max(jar.x, jar.w / 2), W - jar.w / 2);
    buildBackground();
  }

  // Cielo, estrellas y siluetas de árboles se pintan una vez en un canvas aparte.
  function buildBackground() {
    bg = document.createElement('canvas');
    bg.width = cv.width; bg.height = cv.height;
    const b = bg.getContext('2d');
    b.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = b.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#060a1c'); g.addColorStop(.6, '#18204a'); g.addColorStop(1, '#22305e');
    b.fillStyle = g; b.fillRect(0, 0, W, H);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < W * H / 2600; i++) {
      b.fillStyle = `rgba(238,240,255,${.15 + rnd() * .6})`;
      b.beginPath(); b.arc(rnd() * W, rnd() * H * .7, rnd() * 1.2 + .2, 0, 7); b.fill();
    }
    const m = document.createElement('canvas'); m.width = m.height = 60;
    const mc = m.getContext('2d');
    mc.fillStyle = 'rgba(255,244,214,.92)'; mc.beginPath(); mc.arc(30, 30, 22, 0, 7); mc.fill();
    mc.globalCompositeOperation = 'destination-out';
    mc.beginPath(); mc.arc(39, 25, 20, 0, 7); mc.fill();
    b.drawImage(m, W * .8 - 30, H * .14 - 30);
    const hill = (y, color, amp, freq) => {
      b.fillStyle = color; b.beginPath(); b.moveTo(0, H);
      for (let x = 0; x <= W; x += 8) b.lineTo(x, y + Math.sin(x * freq) * amp + Math.sin(x * freq * 2.7) * amp * .4);
      b.lineTo(W, H); b.fill();
    };
    hill(H * .78, '#0f1838', 16, .012);
    for (let i = 0; i < 6; i++) {
      const x = rnd() * W, s = 30 + rnd() * 40, y = H * .8;
      b.fillStyle = '#0c1430';
      b.beginPath(); b.moveTo(x, y - s * 2.2); b.lineTo(x - s * .55, y); b.lineTo(x + s * .55, y); b.fill();
    }
    hill(H * .9, '#08261f', 8, .02);
  }

  function reset() {
    flies = []; drops = []; sparks = [];
    score = 0; lives = MAX_LIVES; combo = 0; t = 0; spawnF = 0; spawnD = 1.5; hurt = 0;
    jar.x = jar.tx = W / 2;
    updateHud();
  }

  const level = () => 1 + Math.floor(t / 20);

  function spawnFly() {
    const gold = Math.random() < 0.08;
    flies.push({
      x: 30 + Math.random() * (W - 60), y: -20,
      vy: (45 + Math.random() * 35) * (1 + (level() - 1) * 0.12),
      amp: 20 + Math.random() * 40, freq: 1 + Math.random() * 2, ph: Math.random() * 6.3,
      bx: 0, gold, r: gold ? 7 : 5
    });
    const f = flies[flies.length - 1]; f.bx = f.x;
  }
  function spawnDrop() {
    drops.push({ x: 20 + Math.random() * (W - 40), y: -30, vy: (170 + Math.random() * 90) * (1 + (level() - 1) * 0.1) });
  }

  function burst(x, y, color, n) {
    if (reduceMotion) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.3, s = 40 + Math.random() * 120;
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: .6 + Math.random() * .4, color });
    }
  }
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

  function update(dt) {
    t += dt;
    jar.x += (jar.tx - jar.x) * Math.min(1, dt * 18);
    const lv = level();
    spawnF -= dt; spawnD -= dt;
    if (spawnF <= 0) { spawnFly(); spawnF = Math.max(.35, 1.1 - lv * .08) * (.6 + Math.random() * .8); }
    if (spawnD <= 0 && t > 3) { spawnDrop(); spawnD = Math.max(.45, 2.2 - lv * .2) * (.6 + Math.random() * .8); }

    const jy = H - jar.h - 28, jl = jar.x - jar.w / 2, jr = jar.x + jar.w / 2;

    for (let i = flies.length - 1; i >= 0; i--) {
      const f = flies[i];
      f.y += f.vy * dt;
      f.x = f.bx + Math.sin(t * f.freq + f.ph) * f.amp;
      if (f.y > jy && f.y < jy + 24 && f.x > jl + 4 && f.x < jr - 4) {
        combo++;
        const pts = (f.gold ? 5 : 1) * (combo >= 10 ? 2 : 1);
        score += pts;
        burst(f.x, jy, f.gold ? '#ffb547' : '#ffe27a', f.gold ? 18 : 8);
        if (f.gold) buzz(15);
        flies.splice(i, 1); updateHud(); continue;
      }
      if (f.y > H + 20) { flies.splice(i, 1); if (combo) { combo = 0; updateHud(); } }
    }

    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.y += d.vy * dt;
      if (hurt <= 0 && d.y > jy && d.y < jy + jar.h && d.x > jl && d.x < jr) {
        drops.splice(i, 1);
        lives--; combo = 0; hurt = 1.2;
        burst(d.x, d.y, '#7fc8ff', 14); buzz([40, 40, 40]);
        updateHud();
        if (lives <= 0) return gameOver();
        continue;
      }
      if (d.y > H + 30) drops.splice(i, 1);
    }
    if (hurt > 0) hurt -= dt;

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 160 * dt; s.life -= dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }
  }

  function drawGlow(x, y, r, color, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.globalAlpha = alpha; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }

  function drawJar() {
    const w = jar.w, h = jar.h, x = jar.x - w / 2, y = H - h - 28;
    if (hurt > 0 && Math.floor(hurt * 10) % 2 === 0) ctx.globalAlpha = .4;
    const fill = Math.min(1, score / 120);
    drawGlow(jar.x, y + h * .6, w * (1 + fill), 'rgba(255,214,100,.55)', .35 + fill * .5);
    ctx.save();
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y + 10, w, h - 10, [8, 8, 16, 16]) : ctx.rect(x, y + 10, w, h - 10);
    ctx.fillStyle = 'rgba(190,220,255,.12)'; ctx.fill();
    ctx.clip();
    const lh = (h - 10) * fill;
    ctx.fillStyle = 'rgba(255,226,122,.35)'; ctx.fillRect(x, y + h - lh, w, lh);
    const inside = Math.min(40, Math.floor(score / 2));
    for (let i = 0; i < inside; i++) {
      const px = x + 8 + ((i * 37) % (w - 16)) + Math.sin(t * 2 + i) * 3;
      const py = y + h - 8 - ((i * 23) % Math.max(10, lh + 10)) + Math.cos(t * 1.7 + i) * 3;
      ctx.fillStyle = 'rgba(255,240,170,.9)';
      ctx.beginPath(); ctx.arc(px, py, 1.6, 0, 7); ctx.fill();
    }
    ctx.restore();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(220,235,255,.75)';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y + 10, w, h - 10, [8, 8, 16, 16]) : ctx.rect(x, y + 10, w, h - 10);
    ctx.stroke();
    ctx.fillStyle = 'rgba(220,235,255,.25)'; ctx.fillRect(x + 6, y + 18, 5, h - 34);
    ctx.fillStyle = '#c99a5b'; ctx.fillRect(x - 3, y + 2, w + 6, 10);
    ctx.fillStyle = '#9b7140'; ctx.fillRect(x - 3, y + 9, w + 6, 3);
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (bg) ctx.drawImage(bg, 0, 0, W, H);
    for (const f of flies) {
      const pulse = .6 + Math.sin(t * 6 + f.ph) * .4;
      drawGlow(f.x, f.y, f.r * 5, f.gold ? 'rgba(255,181,71,.9)' : 'rgba(255,226,122,.8)', pulse * .7);
      ctx.fillStyle = f.gold ? '#ffb547' : '#fff3b0';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (.8 + pulse * .3), 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(238,240,255,.35)';
      const wf = Math.sin(t * 30 + f.ph) * 2;
      ctx.beginPath(); ctx.ellipse(f.x - 4, f.y - 3, 4, 2 + wf * .3, -.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(f.x + 4, f.y - 3, 4, 2 - wf * .3, .5, 0, 7); ctx.fill();
    }
    for (const d of drops) {
      ctx.fillStyle = '#7fc8ff';
      ctx.beginPath();
      ctx.moveTo(d.x, d.y - 14);
      ctx.quadraticCurveTo(d.x + 7, d.y, d.x, d.y + 5);
      ctx.quadraticCurveTo(d.x - 7, d.y, d.x, d.y - 14);
      ctx.fill();
      ctx.strokeStyle = 'rgba(127,200,255,.25)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(d.x, d.y - 16); ctx.lineTo(d.x, d.y - 40); ctx.stroke();
    }
    drawJar();
    for (const s of sparks) {
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  let last = 0;
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000 || 0);
    last = now;
    if (state === 'play') update(dt);
    else t += dt * 0.3;
    draw();
    requestAnimationFrame(loop);
  }

  function updateHud() {
    $('score').textContent = score;
    $('combo').textContent = combo >= 10 ? `×2 · racha ${combo}` : combo >= 3 ? `racha ${combo}` : '';
    $('lvl').textContent = level();
    const L = $('lives');
    if (L.children.length !== MAX_LIVES) { L.innerHTML = ''; for (let i = 0; i < MAX_LIVES; i++) { const s = document.createElement('span'); s.className = 'life'; L.appendChild(s); } }
    [...L.children].forEach((el, i) => el.classList.toggle('off', i >= lives));
  }

  function show(id) { ['start', 'paused', 'over'].forEach(o => $(o).hidden = o !== id); $('pause').hidden = id !== null; }

  function start() { reset(); state = 'play'; show(null); }
  function pause() { if (state === 'play') { state = 'pause'; show('paused'); } }
  function resume() { state = 'play'; show(null); }
  function gameOver() {
    state = 'over';
    const record = score > best;
    if (record) { best = score; store.set(best); }
    $('final').textContent = score;
    $('best1').textContent = best; $('best0').textContent = best;
    $('overTitle').textContent = record && score > 0 ? '¡Nuevo récord!' : 'Se apagó la noche';
    show('over');
  }

  function aim(e) {
    const r = cv.getBoundingClientRect();
    jar.tx = Math.min(Math.max(e.clientX - r.left, jar.w / 2), W - jar.w / 2);
  }
  cv.addEventListener('pointerdown', e => { aim(e); try { cv.setPointerCapture(e.pointerId); } catch {} });
  cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons || e.pressure) aim(e); });
  addEventListener('keydown', e => {
    if (state !== 'play') return;
    if (e.key === 'ArrowLeft') jar.tx = Math.max(jar.w / 2, jar.tx - 40);
    if (e.key === 'ArrowRight') jar.tx = Math.min(W - jar.w / 2, jar.tx + 40);
    if (e.key === 'Escape' || e.key === 'p') pause();
  });

  $('play').onclick = start; $('again').onclick = start;
  $('pause').onclick = pause; $('resume').onclick = resume;
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  addEventListener('resize', resize);

  $('best0').textContent = best; $('best1').textContent = best;
  resize(); updateHud();
  // Escena de muestra detrás del menú: algunas luciérnagas ya volando.
  for (let i = 0; i < 8; i++) { spawnFly(); flies[i].y = Math.random() * H * .7; flies[i].vy = 0; }
  requestAnimationFrame(loop);
})();
</script>
